<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preload" href="imSoGreen.webp" as="image">
        <link rel="icon" type="image/png" href="me.png">
        <title>William Lewsey</title>
    </head>
    <body>

        <header class="site-header">
            William Lewsey
        </header>

        <div class="row">
            <div class="column" id="column1"></div>
            <div class="column" id="column2"></div>
            <div class="column" id="column3"></div>
        </div>

        <footer class="site-footer">
            <p>© 2026 William Lewsey</p>
        </footer>

        <script>
            const column1 = document.getElementById("column1");
            const column2 = document.getElementById("column2");
            const column3 = document.getElementById("column3");

            let cursor = null;

            const textIdentity = "[REPORT BEGIN]\nName: William Lewsey\nOccupation: Game Developer\nPhysical Status: Healthy\nMental Status: Stable\n\nVisage Capture:";

            const textHumour1 = "Looking good.";

            const textSummary = "I have a hand in many aspects of both design and development, since I make games alone. I am able to program systems in a variety of languages and design a range of assets such as models, sprites, and audio.";

            const textEveryday = "I spend a lot of my time worldbuilding and designing creatures, characters and stories. It's easy for me to get drawn into weeks of straight writing.";

            const textProjects = "I have worked on several games both in a team and by myself. My team projects have all been based in university with my classmates. Two of my solo projects were made for the GMTK Game Jam in 2025 and 2026. \n\nMuch of my work has been towards worldbuilding and workshopping new ideas.\n\nHere is a list of all my projects:";

            const textProspexcavator = "PROSPEXCAVATOR\n---\nA game about mining.";

            const textDissertation = "Procedurally Generated 3D Indoor Environments\n---\nMy Dissertation.";

            const textChamber = "Chamber\n---\nA game about claustrophobia.";

            const textAdSomnum = "Ad Somnum\n---\nA game about a hospital.";

            const textLawGame = "Game of Law\n---\nOne of my favourite projects I have made. This game was made as a duo and follows the very mundane life of John Law, a businessman who must decide whether the sentences of criminals are of justified length. He must walk from his flat to work and back every day.Every morning he receives a letter regarding his performance and must keep it high or he will face consequences.";

            const textYATPS = "You Are The Power Source\n---\nThis game was made in university with a few classmates. It follows two rogue robots, Big and Small, trying to escape a facility. They need to complete puzzles to open security doors in order to leave.\n\nThe roles in this project were mostly shared and everyone had a hand in most of the development processes. After making A Sinister Truth, I was very confident in leading the team once more in developing a premise and gameplay elements. This project allowed me to learn valuable lessons in managing team discipline and disagreements. However, all is well that ends well, and this project has never been forgotten.";

            const textASinisterTruth = "A Sinister Truth\n---\nMy first solo game I made at home. An short experimental push of the boat to delve into making games by myself. The game follows a priest, Father Cain* who wakes up in an empty house with his wife and daughter missing. He must travel to his church in search of where his family may have disappeared to.\n\nThis was a fun project as it had me reverse engineering The Dwelling Afar's unreal engine 4 blueprints and putting together my own code. It also allowed me to explore user interface, as well as deeper into audio.";

             const textDwellingAfar = "The Dwelling Afar\n---\nThe first 3D game I made in university as part of the team 'Jelly Doughnut Games'. This game is about escaping a house in the woods by solving puzzles.\n\nI again contributed the premise of the game as well as leading the audio design and implementation. Most of the audio in this game was foley work that I recorded myself, such as furniture sounds and music.\n\nThis game was a big stepping stone for me, as the programmer on my team made some decent code which allowed me to read into how Unreal Engine 4 blueprints really worked. The code was far better than The Stickman and His Hat, so I took the opportunity to analyse it and understand how I can make my own 3D games from scratch.";

            const textStickmanAndHisHat = "The Stickman and His Hat\n---\nThe 2D first game I made in university and my first game made in Unreal Engine 4. This game is about a stickman who loses his hat and must get it back. He fights creatures and collects soup cans to continue his search.\n\nI was part of a team that I titled 'The Curators'. I led the team by coming up with the idea and setting and appointed myself to be in charge of the game's art and design.\n\nI hand drew the stickman and his movement animations, as well as the creatures in the game and the level terrain and decorations. I had previously considered doing Game Art instead of Game Development as a degree, but pivoted as I realised my varied skillset would be better developed as a whole instead of specialising in art. This later turned out to be a wonderful choice.";

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function introPhoto(src, width, height) {
                const imgIntroPhoto = document.createElement("img");
                imgIntroPhoto.src = src;
                imgIntroPhoto.width = width;
                imgIntroPhoto.height = height;
                column1.appendChild(imgIntroPhoto);
            }

            function meshPhoto(src, width, height) {
                const imgMeshPhoto = document.createElement("img");
                imgMeshPhoto.src = src;
                imgMeshPhoto.width = width;
                imgMeshPhoto.height = height;
                column3.appendChild(imgMeshPhoto);
            }

            function createButton(column, id, text, onClick) {
                const button = document.createElement("button");

                button.id = id;
                button.textContent = text;
                button.addEventListener("click", onClick);

                column.appendChild(button);

                return button;
            }

            function showNull() {
                const p = document.createElement("p");

                p.innerHTML = "[Null]";

                column3.appendChild(p);
            }

            function typeText(column, id, text, speed) {
                return new Promise(resolve => {
                    if (cursor) {
                        cursor.classList.remove("typing");
                    }

                    const pre = document.createElement("pre");
                    pre.id = id;
                    column.appendChild(pre);

                    pre.classList.add("typing");
                    cursor = pre;

                    let i = 0;

                    function type() {
                        if (i < text.length) {
                            pre.textContent += text.charAt(i);
                            i++;
                            setTimeout(type, Math.random() * speed + 1);
                        } else {
                            resolve();
                        }
                    }

                    type();
                });
            }

            function showProject(gif, sizeX, sizeY, id, text) {
                column3.innerHTML = "";
                meshPhoto(gif, sizeX, sizeY);
                typeText(column3, id, text);
            }

            async function startIntro() {
                await typeText(column1, "identity", textIdentity);

                await wait(1);

                introPhoto("imSoGreen.webp", 200, 200);

                await wait(1);

                await typeText(column1, "humour1", textHumour1);

                await wait(1);

                await typeText(column1, "summary", textSummary);

                await wait(1);

                await typeText(column1, "everyday", textEveryday);

                await wait(1);

                await typeText(column2, "projects", textProjects);

                await wait(1);

                // BUTTONS

                showNull();

                createButton(column2, "prospexcavatorButton", "PROSPEXCAVATOR", () => showProject("animations/rockMesh.gif", 300, 300, "prospexcavatorContent", textProspexcavator));

                await wait(500);

                createButton(column2, "dissertationButton", "My Dissertation", () => showProject("animations/dissertationMesh.gif", 300, 300, "dissertationContent", textDissertation));

                await wait(500);

                createButton(column2, "chamberButton", "Chamber", () => showProject("animations/chamberMesh.gif", 300, 300, "chamberContent", textChamber));

                await wait(500);
                
                createButton(column2, "adSomnumButton", "Ad Somnum", () => showProject("animations/adSomnumMesh.gif", 300, 300, "adSomnumContent", textAdSomnum));

                await wait(500);

                createButton(column2, "lawGameButton", "Game of Law", () => showProject("animations/lawGameMesh.gif", 300, 300, "lawGameContent", textLawGame));

                await wait(500);

                createButton(column2, "YATPSButton", "You Are The Power Source", () => showProject("animations/YATPSMesh.gif", 300, 300, "YATPSContent", textYATPS));

                await wait(500);

                createButton(column2, "aSinisterTruthButton", "A Sinister Truth", () => showProject("animations/aSinisterTruthMesh.gif", 260, 260, "aSinisterTruthContent", textASinisterTruth));

                await wait(500);

                createButton(column2, "dwellingAfarButton", "The Dwelling Afar", () => showProject("animations/dwellingAfarMesh.gif", 260, 260, "dwellingAfarContent", textDwellingAfar)); 

                await wait(500);

                createButton(column2, "stickmanHatButton", "The Stickman and His Hat", () => showProject("animations/stickmanHatMesh.gif", 100, 100, "stickmanHatContent", textStickmanAndHisHat)); 

            }

            startIntro();
        </script>
    </body>
</html>
