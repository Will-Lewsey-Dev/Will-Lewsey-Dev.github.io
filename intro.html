<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preload" href="imSoGreen.webp" as="image">
        <title>William Lewsey</title>
    </head>
    <body>
        <script>
            let cursor = null;

            const textIdentity = "[REPORT BEGIN]\nName: William Lewsey\nOccupation: Game Developer\nPhysical Status: Healthy\nMental Status: Stable\n\nVisage Capture:";
            
            const textHumour1 = "Looking good.";

            const textSummary = "I have a hand in many aspects of both design and development, since I make games alone. I am able to program systems in a variety of languages and design a range of assets such as models, sprites, and audio.";

            const textEveryday = "I spend a lot of my time worldbuilding and designing creatures, characters and stories. It's easy for me to get drawn into weeks of straight writing.";

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function introPhoto(src, width, height) {
                const imgIntroPhoto = document.createElement("img");
                imgIntroPhoto.src = src;
                imgIntroPhoto.width = width;
                imgIntroPhoto.height = height;
                document.body.appendChild(imgIntroPhoto);
            }

            function typeText(id, text) {
                return new Promise(resolve => {
                    if (cursor) {
                        cursor.classList.remove("typing");
                    }

                    const pre = document.createElement("pre");
                    pre.id = id;
                    document.body.appendChild(pre);

                    pre.classList.add("typing");
                    cursor = pre;

                    let i = 0;

                    function type() {
                        if (i < text.length) {
                            pre.textContent += text.charAt(i);
                            i++;
                            setTimeout(type, Math.random() * 20 + 1);
                        } else {
                            resolve();
                        }
                    }

                    type();
                });
            }

            async function startIntro() {
                await typeText("identity", textIdentity);

                await wait(1000);

                introPhoto("imSoGreen.webp", 200, 200);

                await wait(1000);

                await typeText("humour1", textHumour1);

                await wait(1000);

                await typeText("summary", textSummary);

                await wait(1000);

                await typeText("everyday", textEveryday);
            }

            startIntro();
        </script>
    </body>
</html>
