<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <link rel="preload" href="imSoGreen.webp" as="image">
        <title>William Lewsey</title>
    </head>
    <body>

        <header class="site-header">
            William Lewsey
        </header>

        <div class="row">
            <div class="column" id="column1"></div>
            <div class="column" id="column2"></div>
            <div class="column" id="column3">
            </div>
        </div>

        <footer class="site-footer">
            <p>© 2026 William Lewsey</p>
        </footer>

        <script>
            const column1 = document.getElementById("column1");
            const column2 = document.getElementById("column2");
            const column3 = document.getElementById("column3");

            let cursor = null;

            const textIdentity = "[REPORT BEGIN]\nName: William Lewsey\nOccupation: Game Developer\nPhysical Status: Healthy\nMental Status: Stable\n\nVisage Capture:";

            const textHumour1 = "Looking good.";

            const textSummary = "I have a hand in many aspects of both design and development, since I make games alone. I am able to program systems in a variety of languages and design a range of assets such as models, sprites, and audio.";

            const textEveryday = "I spend a lot of my time worldbuilding and designing creatures, characters and stories. It's easy for me to get drawn into weeks of straight writing.";

            const textProjects = "I have worked on several projects both in a team and solo. My team projects have all been based in university with my classmates.";

            const projectTest = "PROSPEXCAVATOR\n---\nA game about mining.";

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function introPhoto(src, width, height) {
                const imgIntroPhoto = document.createElement("img");
                imgIntroPhoto.src = src;
                imgIntroPhoto.width = width;
                imgIntroPhoto.height = height;
                column1.appendChild(imgIntroPhoto);
            }

            function meshPhoto(src, width, height) {
                const imgMeshPhoto = document.createElement("img");
                imgMeshPhoto.src = src;
                imgMeshPhoto.width = width;
                imgMeshPhoto.height = height;
                column3.appendChild(imgMeshPhoto);
            }

            function createButton(column, id, text, onClick) {
                const button = document.createElement("button");

                button.id = id;
                button.textContent = text;
                button.addEventListener("click", onClick);

                column.appendChild(button);

                return button;
            }

            function typeText(column, id, text, speed = 20) {
                return new Promise(resolve => {
                    if (cursor) {
                        cursor.classList.remove("typing");
                    }

                    const pre = document.createElement("pre");
                    pre.id = id;
                    column.appendChild(pre);

                    pre.classList.add("typing");
                    cursor = pre;

                    let i = 0;

                    function type() {
                        if (i < text.length) {
                            pre.textContent += text.charAt(i);
                            i++;
                            setTimeout(type, Math.random() * speed + 1);
                        } else {
                            resolve();
                        }
                    }

                    type();
                });
            }

            function showProjects() {
                column3.innerHTML = "";
                meshPhoto("rockMesh.gif", 200, 200);
                typeText(column3, "projectsContent", projectTest);
                
            }

            async function startIntro() {
                await typeText(column1, "identity", textIdentity);

                await wait(1000);

                introPhoto("imSoGreen.webp", 200, 200);

                await wait(1000);

                await typeText(column1, "humour1", textHumour1);

                await wait(1000);

                await typeText(column1, "summary", textSummary);

                await wait(1000);

                await typeText(column1, "everyday", textEveryday);

                await wait(1000);

                await typeText(column2, "projects", textProjects);

                await wait(1000);

                createButton(column2, "projectsButton", "Projects", showProjects);

            }

            startIntro();
        </script>
    </body>
</html>
